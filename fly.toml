# fly.toml app configuration file generated for vermelhos-alertas on 2026-10-26T00:05:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vermelhos-alertas'
primary_region = 'ams'

[build]

[env]
  CHECK_SECONDS = '15'
  RELOAD_MINUTES = '20'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
