app = "bot-reds"
primary_region = "cdg"

[build]

[env]
  CHECK_SECONDS = "15"
  RELOAD_MINUTES = "20"
  # LEAGUE_FILTER = "portugal,inglaterra,espanha,itália,alemanha,frança,europa"
  # DEBUG_DUMP = "1"

# O bot só responde "ok" na 8080 para os health checks.
# auto_stop desligado + 1 máquina sempre ligada: o Fly nunca desliga o bot por falta de visitas.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/"

# O Chromium precisa de ~1 GB de RAM.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
